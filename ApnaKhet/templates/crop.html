<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Crop Advisory</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7f5;
            color: #1f2937;
        }

        /* ---------------- HEADER ---------------- */

        header {
            background: #176b3a;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 21px;
            font-weight: bold;
        }

        #languageSelect {
            padding: 8px 12px;
            border-radius: 7px;
            border: none;
            font-size: 14px;
        }

        /* ---------------- NAVIGATION ---------------- */

        nav {
            background: white;
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.08);
        }

        nav button {
            border: none;
            background: #e8f3ec;
            color: #176b3a;
            padding: 10px 20px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        nav button.active {
            background: #176b3a;
            color: white;
        }

        /* ---------------- MAIN ---------------- */

        main {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.07);
        }

        .card h2 {
            margin-bottom: 20px;
            color: #176b3a;
        }

        /* ---------------- FORM ---------------- */

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            margin-bottom: 7px;
            font-weight: bold;
            font-size: 14px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 14px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #176b3a;
        }

        .textarea-wrapper {
            position: relative;
        }

        .mic-btn {
            position: absolute;
            right: 10px;
            top: 10px;
            border: none;
            background: #176b3a;
            color: white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            font-size: 18px;
        }

        .mic-btn.listening {
            background: #dc2626;
        }

        /* ---------------- BUTTONS ---------------- */

        .primary-btn {
            margin-top: 20px;
            background: #176b3a;
            color: white;
            border: none;
            padding: 13px 25px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
        }

        .primary-btn:hover {
            background: #12552e;
        }

        .secondary-btn {
            border: none;
            background: #e8f3ec;
            color: #176b3a;
            padding: 9px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        /* ---------------- RESULT ---------------- */

        #resultCard {
            display: none;
        }

        .score-container {
            display: flex;
            align-items: center;
            gap: 20px;
            margin: 20px 0;
        }

        .score {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 25px;
            font-weight: bold;
        }

        .green {
            background: #16a34a;
        }

        .yellow {
            background: #eab308;
        }

        .red {
            background: #dc2626;
        }

        .advisory {
            background: #f3f4f6;
            padding: 18px;
            border-radius: 8px;
            line-height: 1.6;
            flex: 1;
        }

        /* ---------------- LOGIN ---------------- */

        #loginBox {
            max-width: 400px;
            margin: 40px auto;
        }

        .error {
            color: #dc2626;
            margin-top: 10px;
            display: none;
        }

        /* ---------------- TABLE ---------------- */

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            min-width: 900px;
        }

        th,
        td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
            font-size: 13px;
        }

        th {
            background: #176b3a;
            color: white;
        }

        .score-badge {
            padding: 5px 9px;
            border-radius: 15px;
            color: white;
            font-weight: bold;
            font-size: 12px;
        }

        .whatsapp-btn {
            background: #25d366;
            color: white;
            border: none;
            padding: 7px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        /* ---------------- MOBILE ---------------- */

        @media(max-width: 700px) {
            header {
                flex-direction: column;
                gap: 10px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            nav {
                flex-direction: column;
            }

            nav button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">
        Smart Crop Advisory
    </div>

    <select id="languageSelect" onchange="changeLanguage()">
        <option value="en">English</option>
        <option value="hi">हिंदी</option>
        <option value="mr">मराठी</option>
        <option value="or">ଓଡ଼ିଆ</option>
        <option value="te">తెలుగు</option>
    </select>
</header>

<nav>
    <button id="farmerTab" class="active" onclick="showPage('farmerPage', this)">
        Farmer Portal
    </button>
    <button id="operatorTab" onclick="showPage('operatorPage', this)">
        Officer Dashboard
    </button>
</nav>

<main>
    <!-- FARMER PAGE -->
    <section id="farmerPage" class="page active">
        <div class="card">
            <h2 data-i18n="farmerTitle">
                Farmer Registration & Distress Assessment
            </h2>

            <form id="farmerForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label data-i18n="name">Farmer Name</label>
                        <input type="text" id="name" required placeholder="Enter your name">
                    </div>

                    <div class="form-group">
                        <label data-i18n="phone">Phone Number</label>
                        <input type="tel" id="phone" required placeholder="Enter phone number">
                    </div>

                    <div class="form-group">
                        <label data-i18n="district">District</label>
                        <input type="text" id="district" required placeholder="Enter district">
                    </div>

                    <div class="form-group">
                        <label data-i18n="crop">Crop Name</label>
                        <input type="text" id="crop" required placeholder="Example: Cotton">
                    </div>

                    <div class="form-group">
                        <label data-i18n="landArea">Land Area (Acres)</label>
                        <input type="number" id="landArea" min="0" step="0.1" required>
                    </div>

                    <div class="form-group">
                        <label data-i18n="loan">Loan Due Date</label>
                        <select id="loanStatus">
                            <option value="under15">Under 15 days</option>
                            <option value="30days">Within 30 days</option>
                            <option value="noloan">No loan</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label data-i18n="weather">Weather / Crop Risk</label>
                        <select id="weatherRisk">
                            <option value="severe">Severe rainfall/weather problem</option>
                            <option value="moderate">Moderate problem</option>
                            <option value="normal">Normal</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label data-i18n="yield">Expected Yield / Market Loss</label>
                        <select id="yieldLoss">
                            <option value="high">High loss</option>
                            <option value="medium">Medium loss</option>
                            <option value="low">Low / No loss</option>
                        </select>
                    </div>

                    <div class="form-group full">
                        <label data-i18n="issue">Describe Your Problem</label>
                        <div class="textarea-wrapper">
                            <textarea id="issue" required placeholder="Describe your farming problem..."></textarea>
                            <button type="button" class="mic-btn" id="micButton" onclick="startVoiceRecognition()">
                                MIC
                            </button>
                        </div>
                    </div>
                </div>

                <button type="submit" class="primary-btn" data-i18n="calculate">
                    Submit & Calculate Distress
                </button>
            </form>
        </div>

        <!-- RESULT -->
        <div class="card" id="resultCard">
            <h2 data-i18n="resultTitle">Distress Assessment</h2>

            <div class="score-container">
                <div id="scoreCircle" class="score">0</div>
                <div>
                    <h3>
                        <span data-i18n="score">Distress Score</span>:
                        <span id="scoreText">0</span>/100
                    </h3>
                    <p id="scoreDescription"></p>
                </div>
            </div>

            <div class="advisory">
                <strong data-i18n="advisory">Advisory</strong>
                <p id="advisoryText"></p>
                <button class="secondary-btn" onclick="readAdvisory()" style="margin-top:15px">
                    <span data-i18n="listen">Listen / सुनें</span>
                </button>
            </div>
        </div>
    </section>

    <!-- OPERATOR PAGE -->
    <section id="operatorPage" class="page">
        <!-- LOGIN -->
        <div id="loginBox" class="card">
            <h2 data-i18n="operatorLogin">Officer Login</h2>

            <div class="form-group">
                <label>Operator ID</label>
                <input type="text" id="operatorId" placeholder="operator">
            </div>
            <br>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="operatorPassword" placeholder="admin123">
            </div>

            <button class="primary-btn" onclick="operatorLogin()" data-i18n="login">
                Login
            </button>

            <p id="loginError" class="error">Invalid ID or password.</p>
        </div>

        <!-- DASHBOARD -->
        <div id="dashboard" class="card" style="display:none">
            <h2 data-i18n="dashboardTitle">Farmer Distress Dashboard</h2>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Farmer</th>
                            <th>Phone</th>
                            <th>District</th>
                            <th>Crop</th>
                            <th>Primary Issue</th>
                            <th>Language</th>
                            <th>Score</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="farmerTable"></tbody>
                </table>
            </div>
        </div>
    </section>
</main>

        return String(str)

            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")

    };

    let currentLanguage = "en";

    function changeLanguage() {
        currentLanguage = document.getElementById("languageSelect").value;
        const languageData = translations[currentLanguage];

        document.querySelectorAll("[data-i18n]").forEach(element => {
            const key = element.getAttribute("data-i18n");
            if (languageData[key]) {
                element.textContent = languageData[key];
            }
        });
    }

    // =====================================================
    // PAGE NAVIGATION
    // =====================================================
    function showPage(pageId, button) {
        document.querySelectorAll(".page").forEach(page => {
            page.classList.remove("active");
        });

        document.getElementById(pageId).classList.add("active");

        document.querySelectorAll("nav button").forEach(btn => {
            btn.classList.remove("active");
        });

        button.classList.add("active");

        if (pageId === "operatorPage") {
            loadFarmers();
        }
    }

    // =====================================================
    // FARMER FORM SUBMISSION
    // =====================================================
    document.getElementById("farmerForm").addEventListener("submit", async function(event) {
        event.preventDefault();

        const farmerData = {
            name: document.getElementById("name").value,
            phone: document.getElementById("phone").value,
            district: document.getElementById("district").value,
            crop: document.getElementById("crop").value,
            land_area: document.getElementById("landArea").value,
            loan_status: document.getElementById("loanStatus").value,
            weather_risk: document.getElementById("weatherRisk").value,
            yield_loss: document.getElementById("yieldLoss").value,
            issue: document.getElementById("issue").value,
            language: currentLanguage
        };

        try {
            const response = await fetch("/api/submit-farmer", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(farmerData)
            });

            const result = await response.json();

            if (!result.success) {
                alert(result.message);
                return;
            }

            displayResult(result.score, result.advisory);
        } catch (error) {
            console.error(error);
            alert("Could not connect to the server.");
        }
    });

    // =====================================================
    // DISPLAY SCORE
    // =====================================================
    function displayResult(score, advisory) {
        const resultCard = document.getElementById("resultCard");
        const scoreCircle = document.getElementById("scoreCircle");
        const scoreText = document.getElementById("scoreText");
        const advisoryText = document.getElementById("advisoryText");

        scoreText.textContent = score;
        scoreCircle.textContent = score;
        advisoryText.textContent = advisory;
        scoreCircle.className = "score";

        if (score <= 40) {
            scoreCircle.classList.add("green");
            document.getElementById("scoreDescription").textContent = "Low distress";
        } else if (score <= 70) {
            scoreCircle.classList.add("yellow");
            document.getElementById("scoreDescription").textContent = "Moderate distress";
        } else {
            scoreCircle.classList.add("red");
            document.getElementById("scoreDescription").textContent = "High distress - Immediate attention required";
        }

        resultCard.style.display = "block";
        resultCard.scrollIntoView({ behavior: "smooth" });
    }

    // =====================================================
    // TEXT TO SPEECH
    // =====================================================
    function readAdvisory() {
        const text = document.getElementById("advisoryText").textContent;
        if (!text) return;

        if (window._advisoryAudio) { window._advisoryAudio.pause(); window._advisoryAudio = null; }
        const url = '/api/tts?text=' + encodeURIComponent(text) + '&lang=' + encodeURIComponent(currentLanguage);
        window._advisoryAudio = new Audio(url);
        window._advisoryAudio.play();
    }

    // =====================================================
    // VOICE TO TEXT
    // =====================================================
    function startVoiceRecognition() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
            alert("Speech recognition is not supported in this browser. Please use Google Chrome.");
            return;
        }

        const recognition = new SpeechRecognition();
        const speechLanguages = {
            en: "en-IN",
            hi: "hi-IN",
            mr: "mr-IN",
            or: "or-IN",
            te: "te-IN"
        };

        recognition.lang = speechLanguages[currentLanguage];
        recognition.interimResults = false;
        recognition.continuous = false;

        const micButton = document.getElementById("micButton");

        recognition.onstart = function() {
            micButton.classList.add("listening");
            micButton.textContent = "STOP";
        };

        recognition.onresult = function(event) {
            const transcript = event.results[0][0].transcript;
            const issueBox = document.getElementById("issue");

            if (issueBox.value.trim() !== "") {
                issueBox.value += " " + transcript;
            } else {
                issueBox.value = transcript;
            }
        };

        recognition.onerror = function(event) {
            console.error("Speech recognition error:", event.error);
            alert("Could not understand the voice input.");
        };

        recognition.onend = function() {
            micButton.classList.remove("listening");
            micButton.textContent = "MIC";
        };

        recognition.start();
    }

    // =====================================================
    // OPERATOR LOGIN
    // =====================================================
    function operatorLogin() {
        const id = document.getElementById("operatorId").value;
        const password = document.getElementById("operatorPassword").value;
        const error = document.getElementById("loginError");

        if (id === "operator" && password === "admin123") {
            document.getElementById("loginBox").style.display = "none";
            document.getElementById("dashboard").style.display = "block";
            loadFarmers();
        } else {
            error.style.display = "block";
        }
    }

    // =====================================================
    // LOAD FARMERS & WHATSAPP INTEGRATION
    // =====================================================
    async function loadFarmers() {
        const dashboard = document.getElementById("dashboard");

        if (dashboard.style.display === "none" || dashboard.style.display === "") {
            return;
        }

        try {
            const response = await fetch("/api/get-farmers");
            const result = await response.json();
            const table = document.getElementById("farmerTable");

            table.innerHTML = "";

            result.farmers.forEach(farmer => {
                const row = document.createElement("tr");
                let scoreClass = "green";

                if (farmer.distress_score > 70) {
                    scoreClass = "red";
                } else if (farmer.distress_score > 40) {
                    scoreClass = "yellow";
                }

                const languageNames = {
                    en: "English",
                    hi: "Hindi",
                    mr: "Marathi",
                    or: "Odia",
                    te: "Telugu"
                };

                const language = languageNames[farmer.language] || farmer.language;

                row.innerHTML = `
                    <td>${escapeHTML(farmer.name)}</td>
                    <td>${escapeHTML(farmer.phone)}</td>
                    <td>${escapeHTML(farmer.district)}</td>
                    <td>${escapeHTML(farmer.crop)}</td>
                    <td>${escapeHTML(farmer.issue)}</td>
                    <td>${language}</td>
                    <td>
                        <span class="score-badge ${scoreClass}">
                            ${farmer.distress_score}/100
                        </span>
                    </td>
                    <td>
                        <button class="whatsapp-btn" onclick='connectWhatsApp(${JSON.stringify(farmer)})'>
                            💬 WhatsApp
                        </button>
                    </td>
                `;

                table.appendChild(row);
            });
        } catch (error) {
            console.error("Failed to load farmers:", error);
        }
    }

    function connectWhatsApp(farmer) {
        const text = `Hello ${farmer.name}, we received your request regarding ${farmer.crop}. How can we assist you?`;
        const url = `https://wa.me/${farmer.phone}?text=${encodeURIComponent(text)}`;
        window.open(url, '_blank');
    }
</script>
